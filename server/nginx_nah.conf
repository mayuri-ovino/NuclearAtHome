# nginx site for the Nuclear@Home dashboard, viewer and read-only API (include in the http block).
# The BOINC project web pages keep their own server block; this one serves only the stats site,
# ideally on its own origin (e.g. stats.<project domain>), so viewer scripts never share
# cookies with BOINC logins.

limit_req_zone $binary_remote_addr zone=nah_api:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name stats.example.org;                 # replace
    ssl_certificate     /etc/letsencrypt/live/stats.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The only inline script is the viewer's import map; its hash is pinned here.
    # Recompute if viewer/cascade.html's import map changes.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-+mly31C+QQSAeXrtrKLIXFjPzAin+3Nu2O5/lqJcZv8='; connect-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    root /opt/nuclear-at-home/viewer;
    index index.html;

    location /api/ {
        limit_req zone=nah_api burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;          # gunicorn 'stats.api:application'
    }

    # Snapshot files, reached only through the API's X-Accel-Redirect.
    location /_results/ {
        internal;
        alias /srv/nuclear/science/results/;
        default_type application/octet-stream;
    }
}

server {
    listen 80;
    server_name stats.example.org;
    return 301 https://$host$request_uri;
}
