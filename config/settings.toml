# Nuclear@Home runtime settings.
#
# Physics values mirror docs/interfaces/physics_settings.md and are copied here only
# after the human approves them there. Validator thresholds mirror validator_spec.md,
# credit values credit_spec.md. Any value that is a string starting with "TODO" makes
# the code that needs it refuse to run (server/settings.py).

[campaign]
id = "W-ALPHA-1"
number = 1                                # 4-digit campaign number inside wu_id
wu_prefix = "WA"                          # two capital letters (workunit_schema.json wu_id pattern)
material_family = "W"
composition = { W = 1.0 }
potential_id = "W_EAM_A"                  # Juslin-Wirth EAM (decision log 2026-11-01)
pka_element = "W"
energies_ev = [5000.0, 10000.0]           # Warrier & Bhardwaj benchmark energies (UNVERIFIED)
temperatures_k = [300.0]                  # benchmark temperature
target_per_bin = 100                      # Warrier & Bhardwaj: 100 directions per energy
canary_fraction = "TODO-DECIDE"           # validator_spec.md canary rate
size_tier = "small"
max_in_flight = "TODO-DECIDE"             # WUs created but not yet assimilated

[potentials.W_EAM_A]
lattice = "bcc"
lattice_constant_angstrom = 3.167          # Setyawan 2015 Table 1, JW at 300 K (UNVERIFIED)
# LAMMPS commands (pair_style, pair_coeff incl. the ZBL join) that read potential.dat.
# Written only once the potential and its join are approved (D8).
mod_file = "client/potentials/W_EAM_A.mod"
data_file = "client/potentials/W_EAM_A.dat"
cost_factor = 1.0                         # EAM = 1.0 by definition (credit_spec.md section 1)

[electronic.es_default]
cutoff_ev = 10.0                          # Byggmaestar 2025 (UNVERIFIED; sources range 1-100 eV)
stopping_file = "client/potentials/stopping_W.dat"

[simulation]
box_rule = [[5000.0, 50], [10000.0, 75]]  # Warrier & Bhardwaj Table 1 (UNVERIFIED)
thermostat_cells = "TODO-DECIDE"          # edge-layer thickness in unit cells
thermostat_damp_ps = "TODO-DECIDE"
dt_max_ps = "TODO-DECIDE"
dx_max_angstrom = 0.005                   # Setyawan 2015 (UNVERIFIED)
equilibration_ps = 10.0                   # Warrier & Bhardwaj (UNVERIFIED)
check_interval_steps = "TODO-DECIDE"      # defect count, energy log and progress every N steps
checkpoint_every_checks = "TODO-DECIDE"
snapshot_every_checks = "TODO-DECIDE"
snapshot_min_ke_ev = "TODO-DECIDE"        # viewer only: atoms above this KE go into snapshots
stop_window_ps = "TODO-DECIDE"            # stop when the Frenkel count stays within tolerance this long
stop_tolerance_pairs = "TODO-DECIDE"
max_time_ps = 20.0                        # Warrier & Bhardwaj (UNVERIFIED)
channeling_exclusion_deg = "TODO-DECIDE"

[analysis]
vacancy_cluster_cutoff_angstrom = 5.253     # 4NN = 3.167*sqrt(11)/2, Setyawan 2015 (UNVERIFIED)
interstitial_cluster_cutoff_angstrom = 4.479  # 3NN = 3.167*sqrt(2), Setyawan 2015 (UNVERIFIED)
bootstrap_samples = "TODO-DECIDE"

[validator]
min_md_steps = "TODO-DECIDE"              # V3
energy_tolerance = "TODO-DECIDE"          # V4, as a fraction of the PKA energy
population_test = "TODO-DECIDE"           # replica test; only "zscore" is implemented
outlier_sigma = "TODO-DECIDE"
min_bin_samples = "TODO-DECIDE"           # below this many results a bin has no population test yet
canary_sigma = "TODO-DECIDE"

[credit]
ref_points = 1760.0                       # human decision 2026-11-01
ref_work = "TODO-CALIBRATE"

[badges]
credit_milestones = "TODO-DECIDE"         # list of [badge_id, total_points], ascending
reliable_last_n = "TODO-DECIDE"
reliable_min_rate = "TODO-DECIDE"
veteran_days = "TODO-DECIDE"

[boinc]
app_name = "nuclear_cascade"
project_dir = "/home/boincadm/projects/nuclear"
wu_template = "templates/nah_cascade_in"
result_template = "templates/nah_cascade_out"
fpops_est = "TODO-CALIBRATE"
fpops_bound = "TODO-CALIBRATE"
memory_bytes = "TODO-CALIBRATE"
delay_bound_s = "TODO-DECIDE"
min_quorum = 2                            # validator_spec.md: new hosts always replicated
target_nresults = 2

[storage]
science_dir = "/srv/nuclear/science"      # WU JSON copies and assimilated result files
