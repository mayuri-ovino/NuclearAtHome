# Nuclear@Home runtime settings.
#
# Physics values mirror docs/interfaces/physics_settings.md and are copied here only
# after the human approves them there. Validator thresholds mirror validator_spec.md,
# credit values credit_spec.md. Any value that is a string starting with "TODO" makes
# the code that needs it refuse to run (server/settings.py).

[campaign]
id = "W-ALPHA-1"
number = 1                                # 4-digit campaign number inside wu_id
wu_prefix = "WA"                          # two capital letters (workunit_schema.json wu_id pattern)
material_family = "W"
composition = { W = 1.0 }
potential_id = "W_EAM_A"                  # Juslin-Wirth 2013 modified Ackland-Thetford (exact, from the paper)
pka_element = "W"
energies_ev = [5000.0, 10000.0]           # Warrier & Bhardwaj Table 1 benchmark energies
temperatures_k = [300.0]                  # benchmark temperature
target_per_bin = 100                      # Warrier & Bhardwaj: 100 directions per energy
canary_fraction = 0.02                    # decision log: 2% of WUs
size_tiers = [[260000, "small"], [5000000, "large"]]  # [max atoms, tier]; PROMPT.md: Small ~250k atoms, Large 1-5M
max_in_flight = 100                       # WUs created but not yet assimilated (ops; two machines with 56 threads drained 20)

[potentials.W_EAM_A]
lattice = "bcc"
lattice_constant_angstrom = 3.1674         # measured: NPT 300 K, 0 bar; Setyawan 2015 Table 1: 3.167 (JW, 300 K)
# LAMMPS commands (pair_style, pair_coeff incl. the ZBL join) that read potential.dat.
# Written only once the potential and its join are approved (D8).
mod_file = "client/potentials/W_EAM_A.mod"
data_file = "client/potentials/W_EAM_A.dat"
cost_factor = 1.0                         # EAM = 1.0 by definition (credit_spec.md section 1)

[electronic.es_default]
cutoff_ev = 30.0                          # E_D^min of W, Hemani et al. arXiv:2005.11940 p.5 (the ES method Warrier & Bhardwaj cite)
stopping_file = "client/potentials/stopping_W.dat"

[simulation]
box_rule = [[5000.0, 50], [10000.0, 75]]  # Warrier & Bhardwaj Table 1 (read 2026-11-01)
fixed_cells = 1                           # outermost cells held fixed (Warrier & Bhardwaj Sec. 2, read 2026-11-01)
thermostat_cells = 2                      # next 2 cells thermostatted at T (Warrier & Bhardwaj Sec. 2)
thermostat_damp_ps = 0.1                  # decision log: convention, not in the benchmark papers
dt_max_ps = 0.001                         # Warrier & Bhardwaj: 1 fs timestep
dx_max_angstrom = 0.005                   # Setyawan 2015 Sec. 2
equilibration_ps = 10.0                   # Warrier & Bhardwaj Sec. 2 (they use NPT; we use the measured 300 K a0)
check_interval_steps = 100                # defect count, energy log and progress every N steps (decision log)
checkpoint_every_checks = 20
snapshot_every_checks = 10
snapshot_min_ke_ev = 1.0                  # viewer only: atoms above this KE go into snapshots
stop_window_ps = 20.0                     # = max_time: no early stop; fixed-length runs like the benchmark (decision log)
stop_tolerance_pairs = 0
max_time_ps = 20.0                        # Warrier & Bhardwaj Sec. 2 (read 2026-11-01)
channeling_exclusion_deg = 0.0            # none: benchmark uses uniformly random directions

[analysis]
vacancy_cluster_cutoff_angstrom = 5.2525  # 4NN = a0*sqrt(11)/2, Setyawan 2015 Sec. 3.2
interstitial_cluster_cutoff_angstrom = 4.4794  # 3NN = a0*sqrt(2), Setyawan 2015 Sec. 3.2
bootstrap_samples = 2000

[validator]
min_md_steps = 20000                      # V3: 20 ps at dt <= 1 fs needs at least this many
energy_tolerance = 0.01                   # V4, fraction of (PKA energy + thermostat-removed energy): the real 5 keV run
                                          # reached 4.1e-3 (Langevin tally ~1% inexact over 20 ps; JW r1 step; stopping tally)
boundary_ke_flag_ev = 10.0                # flag (not reject) a run whose recoil above this reaches the boundary layers;
                                          # 10 eV = stopping cutoff, ~400 kT at 300 K
population_test = "none"                  # replicas equivalent when both pass V1-V8 (decision log)
outlier_sigma = 5.0                       # flag, never reject (decision log)
min_bin_samples = 30                      # below this many results nothing is flagged as an outlier
canary_sigma = 3.0

[credit]
ref_points = 1760.0                       # human decision 2026-11-01
ref_work = 7.5e9                          # work of the 5 keV reference WU: 250,000 atoms x 30,000 planned steps x 1.0

[badges]
credit_milestones = [["lithium", 10000], ["beryllium", 100000], ["breeder", 1000000], ["ignition", 10000000]]  # credit_spec.md 4
reliable_last_n = 50                      # credit_spec.md 4
reliable_min_rate = 0.98
veteran_days = 365

[boinc]
app_name = "nuclear_cascade"
project_dir = "/home/boincadm/projects/nuclear"
wu_template = "templates/nah_cascade_in"
result_template = "templates/nah_cascade_out"
# Per size tier (BOINC estimates; measure on the reference machine).
# small: measured 2026-11-02, 5 keV WU on the reference laptop (i7, 1 core): 5,800 s, peak RSS 314 MB.
# shortcut: fpops_est assumes 5e9 FLOPS per core (typical BOINC Whetstone for a modern i7); replace with this
# laptop's BOINC benchmark once a BOINC client runs here. bound = 10x est so slow hosts are not aborted.
small = { fpops_est = 2.9e13, fpops_bound = 2.9e14, memory_bytes = 1e9, delay_bound_s = 604800 }
# large: shortcut: scaled from the 5 keV measurement by atoms (843,750 / 250,000 = 3.375x), not measured;
# replace after a 10 keV calibration run.
large = { fpops_est = 9.8e13, fpops_bound = 9.8e14, memory_bytes = 2e9, delay_bound_s = 1209600 }
min_quorum = 2                            # validator_spec.md: new hosts always replicated
target_nresults = 2

[cores]
# Public hex "core" IDs for our app versions, keyed by BOINC plan class ("" = plain CPU version).
"" = { id = "0xa1", resource = "CPU", label = "LAMMPS 29Aug2024 (CPU)" }
opencl_nvidia_101 = { id = "0xa2", resource = "GPU", label = "LAMMPS 29Aug2024 GPU package (OpenCL)" }
opencl_ati_101 = { id = "0xa2", resource = "GPU", label = "LAMMPS 29Aug2024 GPU package (OpenCL)" }
opencl_intel_gpu_102 = { id = "0xa2", resource = "GPU", label = "LAMMPS 29Aug2024 GPU package (OpenCL)" }

[web]
boinc_url = ""                            # the BOINC project's public address, once the server is up (Join / Log in links)

[storage]
science_dir = "/srv/nuclear/science"      # WU JSON copies and assimilated result files
