# Address of the local staging server and website (read by server.sh and server/staging/up.sh).
#
#   auto          this computer's current home-network address (changes with the Wi-Fi network;
#                 BOINC clients attached at an old address must re-add the project)
#   127.0.0.1     this computer only
#   10.0.0.21     a fixed address: best with a DHCP reservation in the router, so it never changes
#
# Never a public address: staging uses a test signing key. An environment variable
# STAGING_HOST=... overrides this file for one run.
address=auto
