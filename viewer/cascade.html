<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="index.html#overview"><span class="mark" aria-hidden="true"></span><span>Nuclear<span class="at">@</span>Home</span></a><nav aria-label="Sections"><a href="index.html#workunits">Back to work units</a></nav></div></header>
<main>
  <h1>Cascade viewer</h1>
  <form id="pick" class="controls">
    <label>Work unit <input id="wu" name="wu" placeholder="WA-0001-00000001" pattern="[A-Z]{2}-[0-9]{4}-[0-9]{8}" required></label>
    <button>Open</button>
  </form>
  <p id="info" aria-live="polite"></p>
  <canvas id="view" aria-label="3D view of the cascade"></canvas>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <label>Frame <input id="frame" type="range" min="0" max="0" value="0"></label>
    <span id="step"></span>
    <label><input id="showVac" type="checkbox" checked> Vacancies</label>
    <label><input id="showAtoms" type="checkbox" checked> Moving and displaced atoms</label>
  </div>
  <p class="lede">Spheres: atoms that are moving fast (colour = kinetic energy, blue low, red high) or sit off
    their lattice site. Cubes: empty lattice sites (vacancies). Drag to rotate, scroll to zoom.</p>
  <p id="error" class="err" role="alert"></p>
</main>
<script type="module" src="cascade.js"></script>
</body>
</html>
