<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascade Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body class="viewer">
<canvas id="view" aria-label="3D view of the cascade"></canvas>

<div class="panel controls-panel" role="toolbar" aria-label="Viewer controls">
  <span class="label">View</span>
  <button type="button" class="view" data-view="0" aria-label="Perspective view">1</button>
  <button type="button" class="view" data-view="1" aria-label="Top view">2</button>
  <button type="button" class="view" data-view="2" aria-label="Side view">3</button>
  <span class="label">Frame</span>
  <button type="button" id="prev" aria-label="Previous frame">‹</button>
  <span id="counter" class="counter" aria-live="polite">– of –</span>
  <button type="button" id="next" aria-label="Next frame">›</button>
  <button type="button" id="play" aria-label="Play">▶</button>
  <a class="button close" href="index.html#workunits">✕ Close</a>
</div>

<div class="panel info-panel">
  <form id="pick">
    <label>Work unit <input id="wu" name="wu" placeholder="WA-0001-00000001" pattern="[A-Z]{2}-[0-9]{4}-[0-9]{8}" required></label>
    <button>Open</button>
  </form>
  <dl id="facts"></dl>
  <div class="toggles">
    <label><input id="showVac" type="checkbox" checked> Vacancies</label>
    <label><input id="showAtoms" type="checkbox" checked> Atoms</label>
    <label><input id="spin" type="checkbox"> Auto-rotate</label>
  </div>
  <p class="legend"><span class="dot hot"></span>fast &nbsp;<span class="dot cold"></span>slow &nbsp;<span class="cube"></span>empty site</p>
  <p id="error" class="err" role="alert"></p>
</div>

<script type="module" src="cascade.js"></script>
</body>
</html>
