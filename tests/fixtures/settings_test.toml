# TEST VALUES ONLY: arbitrary numbers for unit tests, not physics, thresholds or calibration.
# Nuclear@Home runtime settings.
#
# Physics values mirror docs/interfaces/physics_settings.md and are copied here only
# after the human approves them there. Validator thresholds mirror validator_spec.md,
# credit values credit_spec.md. Any value that is a string starting with "TODO" makes
# the code that needs it refuse to run (server/settings.py).

[campaign]
id = "W-ALPHA-1"
number = 1                                # 4-digit campaign number inside wu_id
wu_prefix = "WA"                          # two capital letters (workunit_schema.json wu_id pattern)
material_family = "W"
composition = { W = 1.0 }
potential_ids = ["W_EAM_A"]
pka_element = "W"
energies_ev = [1000.0, 2000.0]
temperatures_k = [300.0]
target_per_bin = 3
max_attempts = 3
canary_fraction = 0.0
size_tiers = [[200, "small"], [5000000, "large"]]
max_in_flight = 10

[potentials.W_EAM_A]
lattice = "bcc"
lattice_constant_angstrom = { "300" = 3.0 }
# LAMMPS commands (pair_style, pair_coeff incl. the ZBL join) that read potential.dat.
# Written only once the potential and its join are approved (D8).
mod_file = "client/potentials/W_EAM_A.mod"
data_file = "client/potentials/W_EAM_A.dat"
cost_factor = 1.0                         # EAM = 1.0 by definition (credit_spec.md section 1)

[electronic.es_default]
cutoff_ev = 10.0
stopping_file = "client/potentials/stopping_W.dat"

[simulation]
box_rule = [[1500.0, 4], [5000.0, 6]]
fixed_cells = 1
thermostat_cells = 1
thermostat_damp_ps = 0.1
dt_max_ps = 0.001
dx_max_angstrom = 0.05
equilibration_ps = 1.0
check_interval_steps = 100
checkpoint_every_checks = 10
snapshot_every_checks = 5
snapshot_min_ke_ev = 1.0
stop_window_ps = 2.0
stop_tolerance_pairs = 1
max_time_ps = 10.0
channeling_exclusion_deg = 5.0

[analysis]
vacancy_cluster_shell = 4
interstitial_cluster_shell = 3
cluster_cutoff_tolerance = 0.001
bootstrap_samples = 200
tail_cluster_sizes = [2, 5]
tail_min_beyond = 10

[validator]
min_md_steps = 100
energy_tolerance = 0.01
boundary_ke_flag_ev = 10.0
population_test = "zscore"
outlier_sigma = 4.0
min_bin_samples = 5
canary_sigma = 3.0

[credit]
ref_points = 1000.0
ref_work = 1.0e9

[badges]
credit_milestones = [["lithium", 100.0], ["beryllium", 1000.0]]
reliable_last_n = 10
reliable_min_rate = 0.9
veteran_days = 30

[boinc]
app_name = "nuclear_cascade"
project_dir = "/home/boincadm/projects/nuclear"
wu_template = "templates/nah_cascade_in"
result_template = "templates/nah_cascade_out"
small = { fpops_est = 1e12, fpops_bound = 1e13, memory_bytes = 1e9, delay_bound_s = 86400, size_class = 0 }
large = { fpops_est = 1e13, fpops_bound = 1e14, memory_bytes = 4e9, delay_bound_s = 259200, size_class = 1 }
min_quorum = 2                            # validator_spec.md: new hosts always replicated
target_nresults = 2

[cores]
"" = { id = "0xa1", resource = "CPU", label = "CPU" }
opencl_nvidia_101 = { id = "0xa2", resource = "GPU", label = "OpenCL" }

[storage]
science_dir = "/srv/nuclear/science"      # WU JSON copies and assimilated result files
